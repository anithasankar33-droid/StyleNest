<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — StyleNest</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>

<body>

    <div class="auth-page">

        <div class="auth-visual">
            <a href="index.html" class="logo logo-light">Style<em>Nest</em></a>
            <img src="https://images.unsplash.com/photo-1566174053879-31528523f8ae?q=80&w=1000&auto=format&fit=crop"
                alt="Model in a StyleNest gown">
            <div class="auth-quote">
                <p class="quote-mark">“</p>
                <p>Tell us your size once. We'll flag it on every dress that runs differently, before you order.</p>
            </div>
        </div>

        <div class="auth-form-side">
            <a href="index.html" class="logo logo-mobile">Style<em>Nest</em></a>

            <div class="auth-box">
                <p class="eyebrow">Join StyleNest</p>
                <h1>Create your account.</h1>
                <p class="auth-sub">Already have one? <a href="login.html">Sign in</a> instead.</p>

                <form id="signupForm" novalidate>
                    <label>Full Name
                        <input type="text" name="fullName" id="signupName" placeholder="Ananya Rao" required>
                    </label>

                    <label>Email
                        <input type="email" name="email" id="signupEmail" placeholder="you@email.com" required>
                        <span class="field-error" id="signupEmailError"></span>
                    </label>

                    <label>Password
                        <div class="password-field">
                            <input type="password" name="password" id="signupPassword"
                                placeholder="At least 8 characters" required minlength="8">
                            <button type="button" class="toggle-pass" data-target="signupPassword"
                                aria-label="Show password">Show</button>
                        </div>
                        <div class="strength-meter" id="strengthMeter">
                            <span></span><span></span><span></span>
                        </div>
                        <span class="field-hint" id="strengthLabel">Password strength</span>
                    </label>

                    <label class="check terms-check">
                        <input type="checkbox" name="terms" id="agreeTerms" required>
                        <span>I agree to the Terms of Service and Privacy Policy.</span>
                    </label>

                    <button type="submit" class="btn btn-primary auth-submit">Create Account</button>
                </form>

                <div class="auth-divider"><span>or</span></div>

                <button class="btn btn-ghost auth-social">Continue with Google</button>
            </div>
        </div>

    </div>

    <div class="toast" id="toast"></div>

    <script src="js/script.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
